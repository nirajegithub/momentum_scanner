name: NSE Momentum - Universe Refresh

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-momentum
  cancel-in-progress: false

jobs:
  universe:
    name: Refresh NSE Momentum Universe
    runs-on: ubuntu-latest

    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      DRY_RUN: "false"
      MIN_PRICE: "350"
      MIN_PREV_VOLUME: "500000"
      MIN_DAILY_MOVE_PERCENT: "2.0"

      SCANNER_ACTION: "universe_refresh"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh universe
        run: |
          python -m app.main

      - name: Commit universe state
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Save the freshly calculated universe before touching Git state.
          cp state/runtime_state.json /tmp/universe_refresh_state.json

          # Retry because the scanner workflow may push runtime_state.json
          # while this universe-refresh job is running.
          for attempt in 1 2 3; do
            echo "=== Universe state push attempt ${attempt}/3 ==="

            # Always start from the latest remote main.
            git fetch origin main

            # Make the working tree exactly match latest origin/main.
            # The freshly calculated universe is safely stored in /tmp.
            git reset --hard origin/main

            # Merge only the fields owned by Universe Refresh.
            python - <<'PYMERGE'
          import json
          from pathlib import Path

          refreshed_path = Path("/tmp/universe_refresh_state.json")
          latest_path = Path("state/runtime_state.json")

          refreshed = json.loads(refreshed_path.read_text(encoding="utf-8"))

          if latest_path.exists():
              latest = json.loads(latest_path.read_text(encoding="utf-8"))
          else:
              latest = {}

          # Universe Refresh owns ONLY these fields.
          # Scanner/signal state remains untouched.
          latest["date"] = refreshed.get("date")
          latest["universe"] = refreshed.get("universe", [])

          latest_path.write_text(
              json.dumps(latest, indent=2, ensure_ascii=False) + "",
              encoding="utf-8",
          )
          PYMERGE

            git add state/runtime_state.json

            if git diff --cached --quiet; then
              echo "No universe state changes."
              exit 0
            fi

            git commit -m "Refresh NSE momentum universe"

            # Push to main. If scanner pushed first, retry from the
            # newest remote state so scanner changes are never discarded.
            if git push origin HEAD:main; then
              echo "Universe refresh pushed successfully."
              exit 0
            fi

            echo "Push raced with another workflow. Retrying..."
            git reset --hard origin/main
          done

          echo "ERROR: Could not push universe refresh after 3 attempts."
          exit 1
