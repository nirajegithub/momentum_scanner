name: Today P&L Check

on:
  workflow_dispatch:

jobs:
  pnl:
    name: Calculate Today P&L from Last 5M Candle
    runs-on: ubuntu-latest
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DRY_RUN: "false"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Calculate and send P&L
        run: |
          python - <<'EOF'
          import json, sys
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from datetime import datetime, date, timedelta
          import pandas as pd

          sys.path.insert(0, ".")
          from app.dhan_client import DhanClient
          from app.telegram import send
          from app.calendar import previous_trading_day

          IST = ZoneInfo("Asia/Kolkata")
          today = datetime.now(IST).date()
          prev_day = previous_trading_day(today)

          state = json.loads(Path("state/runtime_state.json").read_text(encoding="utf-8"))
          signals = state.get("signals", {})
          if not signals:
              print("No signals found in state.")
              sys.exit(0)

          dhan = DhanClient()

          # Collect all security_ids
          sym_to_sid = {}
          for s in signals.values():
              sym = s.get("symbol")
              sid = s.get("security_id")
              if sym and sid and sym not in sym_to_sid:
                  sym_to_sid[sym] = str(sid)

          # Step 1: Fetch 5M intraday for ALL symbols → day H/L + 15:10 autosquare close
          # Intraday autosquare happens at 15:10; the 15:05 candle closes exactly at 15:10.
          # We use that candle's close as the reference price, falling back to the last
          # available candle if 15:05 hasn't printed yet (mid-day runs).
          print(f"Fetching 5M intraday for {len(sym_to_sid)} symbols (day H/L + 15:10 price)...")
          intraday = {}  # sym -> {day_high, day_low, last_close, last_time}
          for sym, sid in sym_to_sid.items():
              try:
                  df = dhan.historical_intraday_df(
                      security_id=sid,
                      interval=5,
                      from_date=today.isoformat(),
                      to_date=(today + timedelta(days=1)).isoformat(),
                  )
                  if df is not None and not df.empty:
                      # Pick 15:05 candle (closes 15:10) as autosquare reference;
                      # fall back to last available candle for mid-day runs.
                      try:
                          cutoff = pd.Timestamp(f"{today} 15:05").tz_localize(df.index.tz)
                      except Exception:
                          cutoff = pd.Timestamp(f"{today} 15:05")
                      before_cutoff = df[df.index <= cutoff]
                      ref_row = before_cutoff.iloc[-1] if not before_cutoff.empty else df.iloc[-1]
                      ref_start = before_cutoff.index[-1] if not before_cutoff.empty else df.index[-1]
                      try:
                          ref_time = (ref_start + pd.Timedelta(minutes=5)).strftime("%H:%M")
                      except Exception:
                          ref_time = str(ref_start)[11:16]
                      intraday[sym] = {
                          "day_high":   float(df["high"].max()),
                          "day_low":    float(df["low"].min()),
                          "last_close": float(ref_row["close"]),
                          "last_time":  ref_time,
                      }
              except Exception as e:
                  print(f"  {sym}: 5M fetch failed - {e}")

          print(f"5M data fetched for {len(intraday)} symbols")

          # Step 2: Try quote_batch for live LTP override (works during market hours)
          live_ltp = {}
          try:
              batch = dhan.quote_batch(list(sym_to_sid.values()))
              sid_to_sym = {v: k for k, v in sym_to_sid.items()}
              for sid, data in batch.items():
                  sym = sid_to_sym.get(str(sid))
                  ltp = data.get("ltp") if isinstance(data, dict) else None
                  if sym and ltp:
                      live_ltp[sym] = float(ltp)
              print(f"quote_batch returned {len(live_ltp)} live prices")
          except Exception as e:
              print(f"quote_batch failed (expected after hours): {e}")

          # Build final_prices: live LTP if available, else last 5M close
          now_ist = datetime.now(IST).strftime("%H:%M")
          final_prices = {}
          price_times = {}
          for sym in sym_to_sid:
              if sym in live_ltp:
                  final_prices[sym] = live_ltp[sym]
                  price_times[sym] = now_ist
              elif sym in intraday:
                  final_prices[sym] = intraday[sym]["last_close"]
                  price_times[sym] = intraday[sym]["last_time"]

          # Calculate P&L
          rows = []
          no_price = []
          for s in signals.values():
              sym = s.get("symbol", "")
              direction = s.get("direction", "")
              entry = float(s.get("risk", {}).get("entry", 0))
              sl = float(s.get("risk", {}).get("sl", 0))
              t1 = float(s.get("risk", {}).get("t1", 0))
              day_high = intraday.get(sym, {}).get("day_high")
              day_low  = intraday.get(sym, {}).get("day_low")
              ltp_time = price_times.get(sym, "")

              if s.get("sl_hit"):
                  price, tag = sl, "SL"
              elif s.get("highest_target_hit"):
                  tgt = s["highest_target_hit"]
                  price = float(s["risk"].get(tgt.replace("_HIT","").lower(), t1))
                  tag = tgt.replace("_HIT", "")
              else:
                  price = final_prices.get(sym)
                  tag = ""
                  if price is not None:
                      if direction == "BUY" and price < sl:
                          price, tag = sl, "SL"
                      elif direction == "SELL" and price > sl:
                          price, tag = sl, "SL"

              if price is None:
                  no_price.append(sym)
                  continue

              pnl = price - entry if direction == "BUY" else entry - price
              pct = (price - entry) / entry * 100 if direction == "BUY" else (entry - price) / entry * 100
              rows.append((sym, direction, entry, price, pnl, pct, tag, day_high, day_low, ltp_time))

          rows.sort(key=lambda r: r[4], reverse=True)
          win_rows = [r for r in rows if r[4] >= 0]
          loss_rows = [r for r in rows if r[4] < 0]
          total = sum(r[4] for r in rows)
          win_total = sum(r[4] for r in win_rows)
          loss_total = sum(r[4] for r in loss_rows)

          def fmt_row(sym, direction, entry, price, pnl, pct, tag, day_high, day_low, ltp_time):
              icon = "🔼" if direction == "BUY" else "🔽"
              # Dynamic exit label: "Exit (SL)", "Exit (T1/T2/T3)", or plain "Exit"
              exit_label = f"Exit ({tag})" if tag else "Exit"
              time_str = f" @{ltp_time}" if ltp_time else ""
              line1 = f"  {icon} <b>{sym}</b>  {pnl:+.2f} ({pct:+.1f}%){time_str}"
              line2 = f"  <b>Entry:</b> {entry:.1f} → <b>{exit_label}:</b> {price:.1f} = {pnl:+.2f}"
              if day_high is not None and day_low is not None:
                  line3 = f"  Today's <b>H:</b>{day_high:.1f}  <b>L:</b>{day_low:.1f}"
                  return f"{line1}\n{line2}\n{line3}"
              return f"{line1}\n{line2}"

          date_str = today.strftime("%d-%b-%Y")
          lines = [f"<b>📊 P&amp;L — {date_str}</b>", ""]

          if win_rows:
              lines.append(f"<b>🟢 Winners ({len(win_rows)})  {win_total:+.2f}</b>")
              lines.append("")
              for row in win_rows:
                  lines.append(fmt_row(*row))

          if loss_rows:
              if win_rows:
                  lines.append("")
              lines.append(f"<b>🔴 Losers ({len(loss_rows)})  {loss_total:+.2f}</b>")
              lines.append("")
              for row in loss_rows:
                  lines.append(fmt_row(*row))

          if no_price:
              lines.append("")
              lines.append("❓ No price: " + ", ".join(no_price))

          lines.append("")
          total_emoji = "🟢" if total >= 0 else "🔴"
          lines.append(f"{total_emoji} <b>{len(rows)} trades | {len(win_rows)}W {len(loss_rows)}L | {total:+.2f}</b>")
          msg = "\n".join(lines)
          print(msg)
          sent = send(msg)
          print("Telegram sent:", sent)
          EOF
