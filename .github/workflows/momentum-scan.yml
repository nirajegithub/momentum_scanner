name: Momentum Scanner - B1 ORB + RVOL Scanner
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: dhan-api-access
  cancel-in-progress: false
jobs:
  scanner:
    name: Scan NSE Momentum - B1 ORB + RVOL
    runs-on: ubuntu-latest
    env:
      DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}            # trading group — BUY/SELL ALERT only
      TELEGRAM_PERSONAL_CHAT_ID: ${{ secrets.TELEGRAM_TOKEN_ALERT_CHAT_ID }}  # personal — trade mgmt
      DRY_RUN: "false"
      MIN_PRICE: "450"
      MIN_PREV_VOLUME: "500000"
      MIN_DAILY_MOVE_PERCENT: "2.0"
      MIN_DAILY_VOLUME: "100000"
      BUY_RSI_MIN: "50"
      BUY_RSI_MAX: "100"
      SELL_RSI_MIN: "0"
      SELL_RSI_MAX: "50"
      RVOL_LOOKBACK: "20"
      MIN_15M_RVOL: "1.5"
      MAX_15M_RVOL: "8.0"
      REQUIRE_EMA_CROSSOVER: "false"
      MIN_TRADE_SCORE: "3"
      MAX_TRADE_SCORE: "7"
      T1_RR: "1.0"
      T2_RR: "2.0"
      T3_RR: "3.0"
      MIN_RR: "1.0"
      MIN_STOP_DISTANCE_PERCENT: "0.50"
      MAX_STOP_DISTANCE_PERCENT: "3.0"
      RISK_PERCENT: "1.0"
      ENTRY_TIMEFRAME: "5"
      SETUP_TIMEFRAME: "5"
      SCAN_START_HHMM: "930"
      SCAN_END_HHMM: "1330"
      SCANNER_ACTION: "scan"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Cache pip downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.11-${{ hashFiles('requirements.txt') }}
      - name: Install dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Activate virtualenv
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH
      - name: Run B1 ORB + RVOL scanner (places orders inline on signal)
        env:
          PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
          TRADE_QTY: "1"
          MAX_ENTRY_HHMM: "1330"
          MAX_OPEN_POSITIONS: "35"
          DAILY_LOSS_HALT_INR: "-1000"
          ENTRY_CHASE_LIMIT_PCT: "0.015"
        run: python -m app.main

      - name: Fill poll + SL for live ENTRY_PLACED signals
        env:
          PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
          TRADE_QTY: "1"
          MAX_SIGNAL_AGE_MIN: "5"
          MAX_ENTRY_HHMM: "1330"
          MAX_OPEN_POSITIONS: "35"
          DAILY_LOSS_HALT_INR: "-1000"
          ANNOUNCE_START: "false"
        run: python -m app.trade_manager

      - name: Commit scanner state
        env:
          PAPER_MODE: ${{ vars.PAPER_MODE || 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          STATE_FILE="state/runtime_state_$([[ "$PAPER_MODE" == "true" ]] && echo "paper" || echo "live").json"
          git add "$STATE_FILE"
          [ -f state/tg_update_id.json ] && git add state/tg_update_id.json || true
          if git diff --cached --quiet; then
            echo "No scanner state changes."
          else
            git commit -m "Update NSE momentum scanner state [paper=$PAPER_MODE]"
            for i in 1 2 3; do
              if git push; then
                echo "Push succeeded on attempt $i"
                break
              fi
              if [ $i -lt 3 ]; then
                echo "Push rejected (attempt $i) — rebasing onto remote..."
                if ! git pull --rebase origin main; then
                  git checkout --theirs -- "$STATE_FILE"
                  [ -f state/tg_update_id.json ] && git checkout --theirs -- state/tg_update_id.json || true
                  git add "$STATE_FILE"
                  [ -f state/tg_update_id.json ] && git add state/tg_update_id.json || true
                  GIT_EDITOR=true git rebase --continue
                fi
              else
                echo "Push failed after 3 attempts"
                exit 1
              fi
            done
          fi
